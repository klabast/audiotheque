<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link href="%sveltekit.assets%/favicon.png" rel="icon" />
		<link href="%sveltekit.assets%/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
		<link href="%sveltekit.assets%/manifest.webmanifest" rel="manifest" />
		<meta content="#0a0a0a" name="theme-color" />
		<meta content="yes" name="apple-mobile-web-app-capable" />
		<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
		<meta content="Audiotheque" name="apple-mobile-web-app-title" />
		<meta content="width=device-width, initial-scale=1" name="viewport" />
		<script>
			// Pre-hydration FOUC blocker: applies the persisted theme to <html>
			// before first paint so a reload in dark mode never flashes light.
			// Mirrors resolveTheme() in src/lib/stores/theme.svelte.ts — keep
			// both in sync. The storage key MUST match THEME_STORAGE_KEY.
			(function () {
				try {
					var stored = localStorage.getItem('audiod-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var effective;
					if (stored === 'light') effective = 'light';
					else if (stored === 'dark') effective = 'dark';
					else effective = prefersDark ? 'dark' : 'light';
					if (effective === 'dark') {
						document.documentElement.classList.add('dark');
					}
				} catch (_) {
					/* localStorage unavailable — fall back to the SSR default. */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
