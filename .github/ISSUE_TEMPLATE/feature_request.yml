name: Feature request
description: Suggest a feature or change.
title: "[feature] "
labels: ["enhancement", "needs-triage"]
assignees: ["klabast"]

body:
  - type: markdown
    attributes:
      value: |
        Per `CONTRIBUTING.md`, Audiotheque is a personal project with a focused
        scope — not every request can be accepted, but every one is read.
        Describe the **problem** you're trying to solve, not just the
        solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: What user problem does this solve?
      description: Concrete scenario, not abstract wishlist.
      placeholder: |
        "When I do X, the current behaviour Y forces me to Z. I want to
        be able to … so that …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach (optional)
      description: |
        If you have an idea of what the solution could look like — share it.
        Otherwise leave blank, we'll figure out the design together.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you tried or considered solving this.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I've read CONTRIBUTING.md and understand this may not be implemented.
          required: true
