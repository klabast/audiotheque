name: CD Pipeline

# Dave Farley-style deployment pipeline, trunk-based.
#
#   commit-*    fast feedback (<5min) — runs everywhere
#   image       build the release candidate once, tag with git sha
#   acceptance  spin up the real stack, run E2E against the candidate
#   promote     retag the candidate as :latest (main only)
#
# Where each stage runs:
#
#   pull_request  commit stage only. Fast signal while iterating; the
#                 candidate is not built because the PR head is not what
#                 gets merged.
#   merge_group   full pipeline. The merge queue tests the *prospective
#                 combination* of trunk + this PR, so two independently
#                 green PRs can no longer break trunk together. This is
#                 the gate: nothing reaches main without passing it.
#   push (main)   full pipeline plus promote. Squash-merging produces a
#                 new sha, so the artifact that gets released is rebuilt
#                 and re-verified rather than assumed from the queue.
#
# The image is built ONCE per sha and promoted by retag, never rebuilt —
# what carries :latest is bit-identical to what passed acceptance.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

# Trunk pipelines must not overlap: promote retags a shared :latest, so
# two runs finishing out of order would leave :latest on the older commit
# with every job green. Superseded PR runs are cancelled; trunk and queue
# runs always finish, because each commit needs its own verdict.
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"
  IMAGE_NAME: ghcr.io/klabast/audiotheque

jobs:
  # ---------------------------- Commit stage ----------------------------

  commit-server:
    name: Commit / Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: server/go.sum
      - run: make lint-server unit-server
      - run: make build-server
      - uses: actions/upload-artifact@v7
        with:
          name: audiod-binary
          path: server/audiod
          retention-days: 3

  commit-ui:
    name: Commit / UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: go install github.com/swaggo/swag/cmd/swag@latest
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: cd ui && npm ci
      # Single make invocation so generate-api runs once across all targets.
      - run: make lint-ui check-ui unit-ui build-ui
      # Hand the generated swagger spec + TS client to the image stage so
      # it can skip swag, npm ci, and openapi-generator-cli on the runner.
      - uses: actions/upload-artifact@v7
        with:
          name: audiod-api-generated
          path: |
            server/api/spec/swagger.yaml
            ui/src/lib/api/generated/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: audiod-ui-build
          path: ui/build
          retention-days: 3

  # ---------------------------- Image stage -----------------------------

  image:
    name: Build candidate image
    needs: [commit-server, commit-ui]
    # Not on pull_request: the PR head is not what lands, so a candidate
    # built from it would be a candidate for something that never ships.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha-tag: ${{ steps.meta.outputs.sha-tag }}
    steps:
      - uses: actions/checkout@v6

      # The Dockerfile expects the generated swagger spec and TS client
      # in the build context. commit-ui already produced them — pull
      # them in instead of re-running swag + npm ci + openapi-generator.
      - uses: actions/download-artifact@v8
        with:
          name: audiod-api-generated
          path: .

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha-tag=sha-$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Build once, push directly. The job only runs on main, so the
      # build → tarball → docker-load dance from the PR-build flow is
      # no longer needed — acceptance can just pull from GHCR.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha-tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.sha-tag }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=audiod
          cache-to: type=gha,mode=max,scope=audiod

  # -------------------------- Acceptance stage --------------------------

  acceptance:
    name: Acceptance / E2E
    needs: [image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, tablet, mobile]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the candidate image just published by the image job and
      # override docker-compose.test.yml's `build:` with the tagged
      # version. For test-mpd, ALWAYS build from this commit's source:
      # the published :latest tag is only refreshed by
      # test-mpd-image.yml on main pushes that touch tools/test-mpd, so
      # it goes stale on any commit that changes test-mpd code.
      - name: Pull candidate images
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ needs.image.outputs.sha-tag }}
          docker tag ${{ env.IMAGE_NAME }}:${{ needs.image.outputs.sha-tag }} audiotheque-audiod:latest
          docker compose -f docker-compose.test.yml build test-mpd

      - name: Start stack
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Install Playwright browsers
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: Run E2E (${{ matrix.device }})
        run: cd e2e && CI_MODE=true DEVICE=${{ matrix.device }} npx cucumber-js --tags '@${{ matrix.device }} or not (@mobile or @tablet or @desktop)'

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-trace-${{ matrix.device }}
          path: e2e/reports/
          retention-days: 7

  # ----------------------------- Promote --------------------------------

  promote:
    name: Promote candidate → latest
    needs: [image, acceptance]
    # Only a commit that is actually on trunk may carry :latest.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag candidate as :latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ needs.image.outputs.sha-tag }}
